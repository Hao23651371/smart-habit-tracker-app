spring.application.name=smart-habit-tracker
server.port=8080
spring.profiles.active=dev

# Nạp file cấu hình local (nếu tồn tại)
spring.config.import=optional:classpath:application-local.properties,optional:file:./application-local.properties

# Cấu hình MongoDB
spring.data.mongodb.uri=mongodb://localhost:27017/smart_habit_tracker
spring.data.mongodb.database=smart_habit_tracker
spring.data.mongodb.auto-index-creation=true

# JWT Secret & Expiration (24 giờ)
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration=86400000

# Cấu hình Gemini AI (Nạp qua biến môi trường hoặc application-local.properties)
gemini.api.key=${GEMINI_API_KEY:}